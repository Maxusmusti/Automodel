# Orthogonal Subspace Fine-Tuning (OSFT) of Qwen3-8B on SQuAD.
#
# OSFT decomposes each targeted projection with an SVD, freezes the top singular directions, and trains only the
# remaining low-rank factors, keeping updates orthogonal to the frozen subspace (continual learning without
# replay). The HF export contains plain dense weights.
#
# To run this recipe, please use the following command:
# automodel examples/llm_finetune/qwen/qwen3_8b_squad_osft.yaml --nproc-per-node 8

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 64
  local_batch_size: 4
  ckpt_every_steps: 200
  val_every_steps: 100  # will run every x number of gradient steps
  num_epochs: 1

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: Qwen/Qwen3-8B
  # fp32 master weights and AdamW state for the trainable factors; compute runs in bf16 via FSDP2.
  torch_dtype: float32

osft:
  _target_: nemo_automodel.components._peft.osft.OSFTConfig
  # Fraction of each matrix's singular directions (the smallest) that stays trainable.
  unfreeze_rank_ratio: 0.25
  target_modules: ["*.q_proj", "*.k_proj", "*.v_proj", "*.o_proj", "*.gate_proj", "*.up_proj", "*.down_proj"]

checkpoint:
  enabled: true
  checkpoint_dir: checkpoints/
  model_save_format: safetensors
  save_consolidated: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: train

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.squad.make_squad_dataset
  dataset_name: rajpurkar/squad
  split: validation
  limit_dataset_samples: 64

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn:
    _target_: nemo_automodel.components.datasets.utils.default_collater

clip_grad_norm:
  max_norm: 1.0

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1e-8
  lr: 1.0e-5
  weight_decay: 0

ci:
  nemo_ci_schedule: release
  cluster_tag: h100
  recipe_owner: Maxusmusti
  time: "00:45:00"
  nodes: 1
